<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marisol Bay — a tiny open-world crime game</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1b1030; }
  #screen { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Kept for screen readers only: the line the game uses to announce events. */
  #announcer { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="screen" aria-label="Marisol Bay: explore a coastal city on foot and by car, run jobs for Ms. Vega, and stay ahead of the police"></canvas>
<p id="announcer" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
